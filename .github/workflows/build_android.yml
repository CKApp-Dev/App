name: Build (& Deploy to Google Play) Android APP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    env:
      CI: '1'
      BUILD_NUMBER: ${{ github.run_number }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Derive app version
        id: version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tagged = process.env.GITHUB_REF_TYPE === 'tag';
          const version = tagged
            ? process.env.GITHUB_REF_NAME.replace(/^v/, '')
            : require('./package.json').version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Store builds require a numeric major.minor.patch version (tag vX.Y.Z or package.json).');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\n`);
          NODE

      - name: Check lint, types, and behavior
        run: |
          yarn lint
          yarn typecheck
          yarn test --runInBand

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
          # Native projects are generated later; cache by their inputs.
          cache-dependency-path: |
            yarn.lock
            app.config.ts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Generate Android project
        env:
          METRO_API_USER: ${{ secrets.METRO_API_USER }}
          METRO_API_PASS: ${{ secrets.METRO_API_PASS }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
            export GOOGLE_SERVICES_JSON="$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$GOOGLE_SERVICES_JSON" >> "$GITHUB_ENV"
          fi
          npx expo prebuild --platform android --no-install

      - name: Prepare release signing
        env:
          PLAY_SIGNING_KEY: ${{ secrets.PLAY_SIGNING_KEY }}
        run: |
          test -n "$PLAY_SIGNING_KEY"
          printf '%s' "$PLAY_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/ck-upload.jks"
          chmod 600 "$RUNNER_TEMP/ck-upload.jks"
          # Expo's generated release variant uses the debug key. Replace it in
          # this disposable project so Gradle signs both outputs with our upload key.
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  ciRelease {
                      storeFile file(System.getenv('CK_RELEASE_KEYSTORE'))
                      storePassword System.getenv('CK_RELEASE_STORE_PASSWORD')
                      keyAlias System.getenv('CK_RELEASE_KEY_ALIAS')
                      keyPassword System.getenv('CK_RELEASE_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ciRelease
                  }
              }
          }
          GRADLE

      - name: Build signed AAB and APK
        working-directory: android
        env:
          METRO_API_USER: ${{ secrets.METRO_API_USER }}
          METRO_API_PASS: ${{ secrets.METRO_API_PASS }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CK_RELEASE_KEYSTORE: ${{ runner.temp }}/ck-upload.jks
          CK_RELEASE_STORE_PASSWORD: ${{ secrets.PLAY_SIGNING_KEY_STORE_PASSWORD }}
          CK_RELEASE_KEY_ALIAS: ${{ secrets.PLAY_SIGNING_KEY_ALIAS }}
          CK_RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$CK_RELEASE_STORE_PASSWORD"
          test -n "$CK_RELEASE_KEY_ALIAS"
          test -n "$CK_RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Verify and collect signed artifacts
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab "CK_app-${APP_VERSION}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "CK_app-${APP_VERSION}.apk"

      - name: Archive Android build output
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          if-no-files-found: error
          path: |
            CK_app-${{ steps.version.outputs.version }}.aab
            CK_app-${{ steps.version.outputs.version }}.apk

      - name: Publish APK/AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            CK_app-${{ steps.version.outputs.version }}.apk
            CK_app-${{ steps.version.outputs.version }}.aab

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ck-upload.jks"

  deploy-android:
    name: Deploy Android to Google Play
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Android build output
        uses: actions/download-artifact@v5
        with:
          name: android-build

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: org.capacitor.quasar.ckapp
          releaseFiles: '*.aab'
          track: internal
          inAppUpdatePriority: 3
