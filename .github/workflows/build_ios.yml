name: Build (& Deploy to TestFlight) iOS APP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    env:
      CI: '1'
      BUILD_NUMBER: ${{ github.run_number }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      IOS_PUSH_ENVIRONMENT: production
      IOS_TEAM_ID: FJX3SGU9AL
      IOS_PROFILE_NAME: Github Actions
      ENABLE_WIDGETS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Derive app version
        id: version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tagged = process.env.GITHUB_REF_TYPE === 'tag';
          const version = tagged
            ? process.env.GITHUB_REF_NAME.replace(/^v/, '')
            : require('./package.json').version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Store builds require a numeric major.minor.patch version (tag vX.Y.Z or package.json).');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\n`);
          NODE

      - name: Check lint, types, and behavior
        run: |
          yarn lint
          yarn typecheck
          yarn test --runInBand

      - name: Generate iOS project and install pods
        env:
          METRO_API_USER: ${{ secrets.METRO_API_USER }}
          METRO_API_PASS: ${{ secrets.METRO_API_PASS }}
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios

      - name: Install Apple certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$BUILD_PROVISION_PROFILE_BASE64" || -z "$BUILD_WIDGET_PROVISION_PROFILE_BASE64" ]]; then
            echo '::error::Both BUILD_PROVISION_PROFILE_BASE64 (app) and BUILD_WIDGET_PROVISION_PROFILE_BASE64 (widget extension) are required. Create distribution profiles for both app identifiers with the shared App Group group.org.capacitor.quasar.ckapp.'
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/build_widget_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          printf '%s' "$BUILD_WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          security cms -D -i "$WIDGET_PROFILE_PATH" > "$RUNNER_TEMP/widget-profile.plist"
          python3 <<'PY'
          import os, pathlib, plistlib, re, shutil

          team_id = os.environ['IOS_TEAM_ID']
          app_id = 'org.capacitor.quasar.ckapp'
          app_group = f'group.{app_id}'
          runner_temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          profiles = [
              (app_id, 'BUILD_PROVISION_PROFILE_BASE64', 'profile.plist', 'build_pp.mobileprovision', 'IOS_PROFILE_UUID'),
              (f'{app_id}.ExpoWidgetsTarget', 'BUILD_WIDGET_PROVISION_PROFILE_BASE64', 'widget-profile.plist', 'build_widget_pp.mobileprovision', 'IOS_WIDGET_PROFILE_UUID'),
          ]
          validated = []
          for bundle_id, secret_name, plist_name, profile_name, environment_name in profiles:
              with (runner_temp / plist_name).open('rb') as profile_file:
                  profile = plistlib.load(profile_file)
              entitlements = profile.get('Entitlements', {})

              def fail(message):
                  raise SystemExit(f'::error::{secret_name}: {message} Regenerate the distribution profile and update this repository secret.')

              if profile.get('TeamIdentifier') != [team_id]:
                  fail(f'The profile must belong to Apple team {team_id}.')
              if entitlements.get('application-identifier') != f'{team_id}.{bundle_id}':
                  fail(f'The profile must be for the exact app identifier {bundle_id}.')
              if app_group not in entitlements.get('com.apple.security.application-groups', []):
                  fail(f'Enable the shared App Group {app_group} on {bundle_id}.')
              if bundle_id == app_id:
                  if profile.get('Name') != os.environ['IOS_PROFILE_NAME']:
                      fail(f'The app profile must be named {os.environ["IOS_PROFILE_NAME"]}.')
                  if entitlements.get('aps-environment') != os.environ['IOS_PUSH_ENVIRONMENT']:
                      fail('Enable Push Notifications on the Apple app identifier; the profile must include the production APNs entitlement.')
              profile_uuid = profile.get('UUID', '')
              if not re.fullmatch(r'[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}', profile_uuid):
                  fail('The profile is missing a valid UUID.')
              validated.append((profile_uuid, profile_name, environment_name))

          profile_directory = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          profile_directory.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as environment_file:
              for profile_uuid, profile_name, environment_name in validated:
                  environment_file.write(f'{environment_name}={profile_uuid}\n')
                  shutil.copyfile(runner_temp / profile_name, profile_directory / f'{profile_uuid}.mobileprovision')
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Apple Distribution|iPhone Distribution/ { print $2; exit }')"
          test -n "$SIGNING_IDENTITY"
          echo "IOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure app signing and export options
        run: |
          # Apply signing to the app and widget extension targets, never to CocoaPods targets.
          node <<'NODE'
          const fs = require('node:fs');
          const xcode = require('xcode');
          const project = xcode.project('ios/CKAPP.xcodeproj/project.pbxproj');
          project.parseSync();
          const profiles = new Map([
            ['org.capacitor.quasar.ckapp', process.env.IOS_PROFILE_UUID],
            ['org.capacitor.quasar.ckapp.ExpoWidgetsTarget', process.env.IOS_WIDGET_PROFILE_UUID],
          ]);
          const updated = new Set();
          for (const config of Object.values(project.pbxXCBuildConfigurationSection())) {
            const settings = config.buildSettings;
            if (!settings) continue;
            const bundleId = String(settings.PRODUCT_BUNDLE_IDENTIFIER).replaceAll('"', '');
            if (!profiles.has(bundleId)) continue;
            settings.CODE_SIGN_STYLE = 'Manual';
            settings.DEVELOPMENT_TEAM = process.env.IOS_TEAM_ID;
            settings.CODE_SIGN_IDENTITY = process.env.IOS_SIGNING_IDENTITY;
            settings.PROVISIONING_PROFILE_SPECIFIER = '"' + profiles.get(bundleId) + '"';
            settings.MARKETING_VERSION = process.env.APP_VERSION;
            settings.CURRENT_PROJECT_VERSION = process.env.BUILD_NUMBER;
            updated.add(bundleId);
          }
          for (const bundleId of profiles.keys()) {
            if (!updated.has(bundleId)) throw new Error(`Could not find the ${bundleId} target to configure signing. Check that ENABLE_WIDGETS=1 during prebuild.`);
          }
          fs.writeFileSync(project.filepath, project.writeSync());
          NODE
          python3 <<'PY'
          import os, plistlib
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'signingCertificate': os.environ['IOS_SIGNING_IDENTITY'],
              'teamID': os.environ['IOS_TEAM_ID'],
              'provisioningProfiles': {
                  'org.capacitor.quasar.ckapp': os.environ['IOS_PROFILE_UUID'],
                  'org.capacitor.quasar.ckapp.ExpoWidgetsTarget': os.environ['IOS_WIDGET_PROFILE_UUID'],
              },
              'manageAppVersionAndBuildNumber': False,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as export_file:
              plistlib.dump(options, export_file)
          PY

      - name: Archive and export IPA
        env:
          METRO_API_USER: ${{ secrets.METRO_API_USER }}
          METRO_API_PASS: ${{ secrets.METRO_API_PASS }}
        run: |
          xcodebuild -workspace ios/CKAPP.xcworkspace -scheme CKAPP -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CKAPP.xcarchive" \
            -hideShellScriptEnvironment archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CKAPP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath artifacts
          cp artifacts/CKAPP.ipa "CK_app-${APP_VERSION}.ipa"

      - name: Archive iOS build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          if-no-files-found: error
          path: artifacts/CKAPP.ipa

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: CK_app-${{ steps.version.outputs.version }}.ipa

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_pp.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/build_widget_pp.mobileprovision" "$RUNNER_TEMP/widget-profile.plist"
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID}.mobileprovision"
          fi
          if [[ -n "${IOS_WIDGET_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_WIDGET_PROFILE_UUID}.mobileprovision"
          fi

  deploy-ios:
    name: Deploy iOS to TestFlight
    needs: build-ios
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download iOS build output
        uses: actions/download-artifact@v5
        with:
          name: ios-build

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ./CKAPP.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
