name: Build (& Deploy to TestFlight) iOS APP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    env:
      CI: '1'
      BUILD_NUMBER: ${{ github.run_number }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      IOS_PUSH_ENVIRONMENT: production
      IOS_TEAM_ID: FJX3SGU9AL
      IOS_PROFILE_NAME: Github Actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Derive app version
        id: version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tagged = process.env.GITHUB_REF_TYPE === 'tag';
          const version = tagged
            ? process.env.GITHUB_REF_NAME.replace(/^v/, '')
            : require('./package.json').version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Store builds require a numeric major.minor.patch version (tag vX.Y.Z or package.json).');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\n`);
          NODE

      - name: Check lint, types, and behavior
        run: |
          yarn lint
          yarn typecheck
          yarn test --runInBand

      - name: Generate iOS project and install pods
        env:
          METRO_API_USER: ${{ secrets.METRO_API_USER }}
          METRO_API_PASS: ${{ secrets.METRO_API_PASS }}
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APP="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          PROFILE_PUSH_ENVIRONMENT="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)"
          test "$PROFILE_NAME" = "$IOS_PROFILE_NAME"
          test "$PROFILE_TEAM" = "$IOS_TEAM_ID"
          test "$PROFILE_APP" = "${IOS_TEAM_ID}.org.capacitor.quasar.ckapp"
          if [ "$PROFILE_PUSH_ENVIRONMENT" != "$IOS_PUSH_ENVIRONMENT" ]; then
            echo '::error::The distribution provisioning profile must include the production APNs entitlement. Enable Push Notifications on the Apple app identifier, regenerate the profile, and update BUILD_PROVISION_PROFILE_BASE64.'
            exit 1
          fi
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Apple Distribution|iPhone Distribution/ { print $2; exit }')"
          test -n "$SIGNING_IDENTITY"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure app signing and export options
        run: |
          # Apply signing only to the app target, never to CocoaPods targets.
          node <<'NODE'
          const fs = require('node:fs');
          const xcode = require('xcode');
          const project = xcode.project('ios/CKAPP.xcodeproj/project.pbxproj');
          project.parseSync();
          let updated = 0;
          for (const config of Object.values(project.pbxXCBuildConfigurationSection())) {
            const settings = config.buildSettings;
            if (!settings || String(settings.PRODUCT_BUNDLE_IDENTIFIER).replaceAll('"', '') !== 'org.capacitor.quasar.ckapp') continue;
            settings.CODE_SIGN_STYLE = 'Manual';
            settings.DEVELOPMENT_TEAM = process.env.IOS_TEAM_ID;
            settings.CODE_SIGN_IDENTITY = process.env.IOS_SIGNING_IDENTITY;
            settings.PROVISIONING_PROFILE_SPECIFIER = '"' + process.env.IOS_PROFILE_NAME + '"';
            settings.MARKETING_VERSION = process.env.APP_VERSION;
            settings.CURRENT_PROJECT_VERSION = process.env.BUILD_NUMBER;
            updated++;
          }
          if (!updated) throw new Error('Could not find the CK APP target to configure signing.');
          fs.writeFileSync(project.filepath, project.writeSync());
          NODE
          python3 <<'PY'
          import os, plistlib
          # Preserves the old archive.plist's App Store export and profile mapping.
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'signingCertificate': os.environ['IOS_SIGNING_IDENTITY'],
              'teamID': os.environ['IOS_TEAM_ID'],
              'provisioningProfiles': {'org.capacitor.quasar.ckapp': os.environ['IOS_PROFILE_NAME']},
              'manageAppVersionAndBuildNumber': False,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as export_file:
              plistlib.dump(options, export_file)
          PY

      - name: Archive and export IPA
        env:
          METRO_API_USER: ${{ secrets.METRO_API_USER }}
          METRO_API_PASS: ${{ secrets.METRO_API_PASS }}
        run: |
          xcodebuild -workspace ios/CKAPP.xcworkspace -scheme CKAPP -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CKAPP.xcarchive" \
            -hideShellScriptEnvironment archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CKAPP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath artifacts
          cp artifacts/CKAPP.ipa "CK_app-${APP_VERSION}.ipa"

      - name: Archive iOS build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          if-no-files-found: error
          path: artifacts/CKAPP.ipa

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: CK_app-${{ steps.version.outputs.version }}.ipa

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_pp.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID}.mobileprovision"
          fi

  deploy-ios:
    name: Deploy iOS to TestFlight
    needs: build-ios
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download iOS build output
        uses: actions/download-artifact@v5
        with:
          name: ios-build

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ./CKAPP.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
