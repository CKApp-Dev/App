# Copy to .github/workflows/announcements.yml in ChrisSun0731/CK-App-Admin.
# This repository's root contains the admin website; the worker is firebase/worker.
name: Publish announcements and send notifications

on:
  schedule:
    # Offset from the busy start of each hour. GitHub schedules are best effort.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: announcement-worker-main
  cancel-in-progress: false

jobs:
  announcements:
    if: github.repository == 'ChrisSun0731/CK-App-Admin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/worker/package-lock.json
      # Install before minting short-lived Google credentials.
      - name: Install worker dependencies
        run: npm ci --prefix firebase/worker --ignore-scripts
      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          project_id: ck-app-database
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Publish due announcements and process notification delivery
        timeout-minutes: 4
        run: npm --prefix firebase/worker run start
        env:
          GOOGLE_CLOUD_PROJECT: ck-app-database
          # Optional, only for Expo projects with push access protection enabled.
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
